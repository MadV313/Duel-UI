<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071216" />
  <title>SV13 TCG — Duel Field</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="icon" href="images/cards/000_WinterlandDeathDeck_Back.png" />
  <script type="module" src="scripts/sessionApp.js"></script>
</head>
<body>
  <div class="snowfall" aria-hidden="true"></div>

  <div id="session-status" class="session-status working" role="status" aria-live="polite">
    Connecting to duel session…
  </div>

  <!-- Opponent: classic original Duel UI placement -->
  <div id="player2-hand" class="hand hand--top"></div>
  <div id="player2-field" class="field"></div>

  <!-- HP + turn: intentionally retained from the original Duel UI -->
  <div id="hp-display">
    <div>Opponent HP: <span id="player2-hp">200</span></div>
    <div>You HP: <span id="player1-hp">200</span></div>
  </div>
  <div id="turn-display" class="hidden">Waiting for server state…</div>

  <!-- Local player -->
  <div id="player1-field" class="field"></div>
  <div id="player1-hand" class="hand hand--bottom"></div>

  <!-- Original gameplay semantics: draw is automatic; End Turn is the normal turn control. -->
  <div id="controls">
    <button id="drawBtn" type="button" aria-hidden="true" tabindex="-1">Draw</button>
    <button id="endTurnBtn" type="button">End Turn</button>
    <button id="forfeitBtn" type="button" class="danger-action">Forfeit</button>
  </div>

  <div id="announcement" class="overlay hidden" aria-live="assertive"></div>

  <div id="coinFlipContainer" aria-hidden="true">
    <div class="coin-flip-container">
      <img class="coin-flip-image" src="images/effects/coin_flip.gif" alt="Coin Flip" />
      <div class="coin-flip-result" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Original anchored discard counters. Deck/discard artwork is provided by the hand pseudo-elements. -->
  <div class="discard-anchor discard-anchor--top">
    <div id="player2-discard-counter" class="discard-counter">Discard: 0</div>
  </div>
  <div class="discard-anchor discard-anchor--bottom">
    <div id="player1-discard-counter" class="discard-counter">Discard: 0</div>
  </div>

  <a href="https://sv13tcg.com" class="return-to-hub" id="returnToHub">← Return to HUB</a>

  <section id="duel-error" class="duel-error hidden" role="alert">
    <div class="duel-error-card">
      <h2 id="duel-error-title">Duel unavailable</h2>
      <p id="duel-error-message"></p>
      <div class="error-actions">
        <button id="retrySessionBtn" type="button">Retry</button>
        <a href="https://sv13tcg.com">Return to HUB</a>
      </div>
    </div>
  </section>

  <section id="winner-overlay" class="winner-session-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="winner-title">
    <div class="winner-session-card">
      <div class="eyebrow">SERVER FINALIZED</div>
      <h2 id="winner-title">Duel Complete</h2>
      <p id="winner-reason"></p>
      <div class="winner-actions">
        <a id="viewSummaryBtn" href="https://summary.sv13tcg.com">View Full Summary</a>
        <a href="https://sv13tcg.com">Return to HUB</a>
      </div>
    </div>
  </section>
</body>
</html>
